# Coordinates and dimensions are millimetres. Net/reference selectors are case
# sensitive shell globs. Missing selectors fail instead of silently doing nothing.
[stitch]
net = "GND"
diameter_mm = 0.6
drill_mm = 0.3
# KiCad annular width is radial: (diameter - drill) / 2. Keep native WARNING
# issues on generated vias visible without rejecting the via. Errors still block.
# Set false to enforce a no-new-warnings policy for annular width as well.
allow_annular_width_warnings = true
# New errors and electrical hazards (shorts, clearance, new unconnected items...)
# always block. Other new KiCad warnings, e.g. isolated copper fragments left by
# refill, are reported as advisories. Set true to block every new warning.
block_new_warnings = false
clearance_mm = 0.2
edge_clearance_mm = 0.3
component_clearance_mm = 0.25
min_spacing_mm = 1.0
perimeter_offset_mm = 1.0

perimeter = true
islands = true
grid = true
fingers = true
auto_pairs = true
# Continuous fences need an offset appropriate to the transmission-line design.
# The default auto-pair pass adds symmetric return vias at layer transitions.
pair_fences = false
signal_offset_mm = 1.0

# Separate density targets. Omitted interior pitch uses board area; omitted edge
# pitch is half the interior target, never below legal spacing. These defaults
# are geometric heuristics, not electrical sign-off.
# grid_pitch_mm = 8.0
# perimeter_pitch_mm = 4.0
# signal_pitch_mm = 3.0
# finger_pitch_mm = 2.0
# search_radius_mm = 4.0
grid_pattern = "staggered" # or "square"; either pattern can move around obstacles
# Internal power planes may form antipads around GND vias during native refill.
# Outer-layer power/switch-node zones remain protected by default.
zone_policy = "internal_antipads" # "avoid" protects all zones; "antipads" allows all
# pitch_mm remains supported as an alias for the interior grid target.
# max_frequency_hz = 2.4e9
# rise_time_ns = 0.5
epsilon_r = 4.3
wavelength_divisor = 20.0
grid_wavelength_divisor = 10.0

neck_width_mm = 1.5
max_vias = 5000
max_samples = 250000

# Optionally anchor reference ground at an existing plated connection. Otherwise
# the largest existing connected copper component is the reference.
# anchors_mm = [[105.0, 72.0]]

# All-pass exclusions, e.g. the antenna manufacturer's protected radiator region.
# Rectangles use board coordinates [min_x, min_y, max_x, max_y]. Native via/pour
# keepouts are respected automatically, including footprint-local keepouts.
# exclusions_mm = [[120.0, 65.0, 135.0, 80.0]]

# Explicit RF feed selection. This fences the chosen nets, not the radiator.
# [[signal]]
# name = "2.4 GHz feed"
# nets = ["/RF/ANT_FEED", "/RF/MATCH*"]
# mode = "fence"
# offset_mm = 1.2
# pitch_mm = 2.0

# Selecting references follows ALL non-ground nets on their pads; use net names
# if a component has unrelated power/control connections.
# [[signal]]
# name = "RF connector"
# references = ["J_RF1"]
# mode = "fence"
# offset_mm = 1.2

# For pairs without a recognized naming suffix, select exactly two nets and add:
# differential = true
